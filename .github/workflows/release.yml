name: Lokit tagged release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and bundle pinned local codecs
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run vendor-codecs
      - name: Check tag and project version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          node scripts/release.mjs --check
          node -e "import('./js/version.js').then(x=>{if(process.env.REF_NAME!=='v'+x.APP_VERSION)process.exit(1)})"
          npm test
      - name: Retrieve and verify pinned editor releases
        run: |
          python scripts/vendor-pdfcraft.py
          python scripts/vendor-artcraft.py --workers 3
          python scripts/verify-artcraft-bundles.py
      - name: Assemble complete standalone website
        run: |
          python scripts/prepare-site.py
          (cd _site && zip -qr ../lokit-${GITHUB_REF_NAME}.zip .)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "lokit-${GITHUB_REF_NAME}.zip" --title "Lokit $GITHUB_REF_NAME" --generate-notes --verify-tag
