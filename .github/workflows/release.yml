name: Lokit tagged release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and bundle pinned local codecs
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run vendor-codecs
      - name: Check tag and project version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          node scripts/release.mjs --check
          node -e "import('./js/version.js').then(x=>{if(process.env.REF_NAME!=='v'+x.APP_VERSION)process.exit(1)})"
          npm test
      - name: Assemble standalone GitHub Pages bundle
        run: |
          mkdir -p _site/js/vendor _site/icons _site/assets/codecs
          cp index.html analytics.html about.html batch.html style.css style-enhancements.css layout-compact.css sidebar.css glow.css batch.css sw.js manifest.webmanifest .nojekyll _site/
          cp js/*.js _site/js/
          cp js/vendor/*.js _site/js/vendor/
          cp icons/* _site/icons/
          cp assets/codecs/* _site/assets/codecs/
          (cd _site && zip -qr ../lokit-${GITHUB_REF_NAME}.zip .)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "lokit-${GITHUB_REF_NAME}.zip" --title "Lokit $GITHUB_REF_NAME" --generate-notes --verify-tag
