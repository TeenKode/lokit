name: Test and publish Lokit
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js js/vendor/*.js sw.js; do node --check "$file"; done
      - name: Unit and schema tests
        run: |
          node tests/test-tools.mjs
          node tests/test-editor.mjs
          node tests/test-media.mjs
          node tests/test-analytics.mjs
          python tests/test-structure.py
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser integration tests
        run: python tests/test-browser.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lokit-browser-screenshots
          path: .test-output/
          if-no-files-found: ignore

