name: Test and publish Lokit
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js sw.js analytics-worker/src/*.js; do node --check "$file"; done
      - name: Unit and schema tests
        run: |
          node tests/test-tools.mjs
          node tests/test-media.mjs
          node tests/test-analytics.mjs
          node tests/test-worker.mjs
          python tests/test-sql.py
          python tests/test-structure.py
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser integration tests
        run: python tests/test-browser.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lokit-browser-screenshots
          path: .test-output/
          if-no-files-found: ignore

  pages:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Create static site artifact
        run: |
          mkdir -p _site/js _site/icons
          cp index.html analytics.html style.css sw.js manifest.webmanifest .nojekyll _site/
          cp js/*.js _site/js/
          cp icons/* _site/icons/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Live HTTP smoke test
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          for path in '' analytics.html js/app.js js/analytics-page.js sw.js; do
            curl --fail --location --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "${SITE_URL%/}/${path}" -o /tmp/lokit-response
            test -s /tmp/lokit-response
            echo "OK: ${path:-index.html}"
          done
