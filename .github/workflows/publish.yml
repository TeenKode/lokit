name: Lokit quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lokit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned codec packages
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build same-origin optional codecs
        run: npm run vendor-codecs
      - name: Static JavaScript checks
        run: |
          for file in js/*.js js/vendor/*.js sw.js scripts/*.mjs; do node --check "$file"; done
      - name: Unit, version and structure tests
        run: npm test

  pdfcraft:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test the vendor archive validation
        run: python tests/test-pdfcraft.py
      - name: Verify the pinned official release can be packaged
        run: |
          python scripts/vendor-pdfcraft.py
          test -s pdfcraft/index.html
          test -s pdfcraft/NOTICE
          test -s pdfcraft/offline-assets.json

  artcraft:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test ArtCraft archive and metadata validation
        run: |
          python tests/test-artcraft.py
          node tests/test-artcraft.mjs
      - name: Fetch and verify all 15 official web releases
        run: |
          python scripts/vendor-artcraft.py --workers 3
          python scripts/verify-artcraft-bundles.py

  formats:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure FFmpeg and FFprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Generate representative codec samples and verify decoded outputs
        run: python tests/test-formats.py
      - name: Save diagnostic manifest on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lokit-media-fixture-report
          path: |
            tests/fixtures/generated/manifest.json
            tests/fixtures/generated/results.json
          if-no-files-found: ignore

  browser:
    needs: [unit, formats]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mobile: false
          - browser: chromium
            mobile: true
          - browser: firefox
            mobile: false
          - browser: webkit
            mobile: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build same-origin optional codecs
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run vendor-codecs
      - name: Install Playwright browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps "$BROWSER"
      - name: Cross-browser smoke test
        env:
          BROWSER: ${{ matrix.browser }}
          MOBILE: ${{ matrix.mobile }}
        run: |
          if [ "$MOBILE" = true ]; then
            python tests/test-cross-browser.py --browser "$BROWSER" --mobile
          else
            python tests/test-cross-browser.py --browser "$BROWSER"
          fi
      - name: Browser batch processing and ZIP
        env:
          BROWSER: ${{ matrix.browser }}
          MOBILE: ${{ matrix.mobile }}
        run: |
          if [ "$MOBILE" = true ]; then
            python tests/test-batch.py --browser "$BROWSER" --mobile
          else
            python tests/test-batch.py --browser "$BROWSER"
          fi
      - name: Multi-track, subtitles and capture integration
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-v081-browser.py
      - name: Broken-media recovery in Chromium
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-reliability-browser.py
      - name: "Responsive layout: desktop, tablet, mobile, editor, batch"
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-layout.py
      - name: Grouped sidebar, favorites and drawer responsiveness
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-sidebar.py
      - name: PDFCraft offline caching and reload in Chromium
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-pdfcraft-offline-browser.py
      - name: ArtCraft progress, offline reload and iframe smoke
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-artcraft-browser.py
      - name: Full Chromium integration tests
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-browser.py
      - name: Experimental engines fall back when optional local assets are unavailable
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-experimental-browser.py
      - name: Offline codec prefetch, reload and cache removal in Chromium
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-offline-browser.py
      - name: Live optional engines (same-origin assets, diagnostic)
        if: matrix.browser == 'chromium' && matrix.mobile == false
        continue-on-error: true
        timeout-minutes: 10
        run: python tests/test-experimental-live.py
      - name: "Real bundled FFmpeg/WASM - merge, split, watermark, VR"
        if: matrix.browser == 'chromium' && matrix.mobile == false
        timeout-minutes: 12
        run: python tests/test-ffmpeg-wasm-composite.py
      - name: VP8 / H.264 decoding smoke
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-codecs.py
      - name: Screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lokit-failure-${{ matrix.browser }}-${{ matrix.mobile }}
          path: .test-output/
          if-no-files-found: ignore
