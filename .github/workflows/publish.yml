name: Lokit quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lokit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static JavaScript checks
        run: |
          for file in js/*.js js/vendor/*.js sw.js scripts/*.mjs; do node --check "$file"; done
      - name: Unit, version and structure tests
        run: npm test

  formats:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure FFmpeg and FFprobe
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Generate representative codec samples and verify decoded outputs
        run: python tests/test-formats.py
      - name: Save diagnostic manifest on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lokit-media-fixture-report
          path: |
            tests/fixtures/generated/manifest.json
            tests/fixtures/generated/results.json
          if-no-files-found: ignore

  browser:
    needs: [unit, formats]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mobile: false
          - browser: chromium
            mobile: true
          - browser: firefox
            mobile: false
          - browser: webkit
            mobile: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright browser
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps "$BROWSER"
      - name: Cross-browser smoke test
        env:
          BROWSER: ${{ matrix.browser }}
          MOBILE: ${{ matrix.mobile }}
        run: |
          if [ "$MOBILE" = true ]; then
            python tests/test-cross-browser.py --browser "$BROWSER" --mobile
          else
            python tests/test-cross-browser.py --browser "$BROWSER"
          fi
      - name: Browser batch processing and ZIP
        env:
          BROWSER: ${{ matrix.browser }}
          MOBILE: ${{ matrix.mobile }}
        run: |
          if [ "$MOBILE" = true ]; then
            python tests/test-batch.py --browser "$BROWSER" --mobile
          else
            python tests/test-batch.py --browser "$BROWSER"
          fi
      - name: Full Chromium integration tests
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-browser.py
      - name: Experimental engines fall back when optional CDN is blocked
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-experimental-browser.py
      - name: Live optional engines (external CDN, diagnostic)
        if: matrix.browser == 'chromium' && matrix.mobile == false
        continue-on-error: true
        timeout-minutes: 10
        run: python tests/test-experimental-live.py
      - name: VP8 / H.264 decoding smoke
        if: matrix.browser == 'chromium' && matrix.mobile == false
        run: python tests/test-codecs.py
      - name: Screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lokit-failure-${{ matrix.browser }}-${{ matrix.mobile }}
          path: .test-output/
          if-no-files-found: ignore
